<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Speexx Language Training ROI Calculator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --accent: #FF7900;
      --bg: #020617;
      --text-light: #FFFFFF;
      --text-muted: #9ca3af;
      --card-border: rgba(148,163,184,0.3);
      --shadow-soft: 0 24px 40px rgba(15, 23, 42, 0.45);
      --shadow-subtle: 0 4px 12px rgba(15, 23, 42, 0.2);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%, #000000 100%);
      color: var(--text-light);
      line-height: 1.5;
      font-size: 16px;
    }

    .shell {
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px 48px;
    }

    .page {
      width: 100%;
      max-width: 1100px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
      padding: 0 8px;
    }

    header h1 {
      margin: 0 0 16px;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    header p {
      margin: 0;
      font-size: 1rem;
      color: #cbd5f5;
      max-width: 640px;
      margin-inline: auto;
    }

    .main-card {
      background: linear-gradient(135deg, #020617 0, #020617 40%, #111827 100%);
      border-radius: 24px;
      padding: 30px;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--card-border);
      display: grid;
      gap: 34px;
    }

    @media (min-width: 900px) {
      .main-card {
        grid-template-columns: minmax(0, 1.7fr) minmax(0, 1.3fr);
      }
    }

    /* FORM PANEL (LEFT) */

    .form-panel {
      background: rgba(15,23,42,0.96);
      border-radius: 20px;
      padding: 28px 24px 30px;
      border: 1px solid rgba(31,41,55,0.9);
      box-shadow: var(--shadow-subtle);
    }

    .steps-header { margin-bottom: 20px; }

    .steps-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .steps-subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* Progress bar */

    .progress-wrapper {
      margin-top: 12px;
      margin-bottom: 10px;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      border-radius: 999px;
      background: rgba(31,41,55,0.9);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #f97316, #fb923c);
      transition: width 0.25s ease-out;
    }

    .progress-label {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Waiting / calculation status label */

    .calc-status {
      min-height: 1.2em;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .hidden {
      display: none;
    }

    .step {
      padding-top: 26px;
      margin-top: 24px;
      border-top: 1px solid rgba(55,65,81,0.85);
      display: none;
    }

    .step.active { display: block; }

    .step:first-of-type {
      border-top: none;
      padding-top: 0;
      margin-top: 0;
    }

    .step-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 20px;
    }

    .step-badge {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: rgba(249,115,22,0.1);
      border: 1px solid rgba(249,115,22,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      color: #f97316;
      flex-shrink: 0;
    }

    .step-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .step-hint {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .field { margin-bottom: 22px; }

    .field label {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .field small {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    select,
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      background: #020617;
      color: #e5e7eb;
      font-size: 0.95rem;
    }

    select:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: #f97316;
      box-shadow: 0 0 0 1px rgba(249,115,22,0.6);
    }

    .radio-group,
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-top: 6px;
      font-size: 0.9rem;
    }

    .radio-group label,
    .checkbox-group label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .impact-grid {
      display: grid;
      grid-template-columns: minmax(0,1fr);
      row-gap: 12px;
      column-gap: 14px;
      margin-top: 10px;
    }

    @media (min-width: 720px) {
      .impact-grid {
        grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      }
    }

    .impact-grid label { align-items: flex-start; }

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    .btn-primary {
      flex: 1;
      padding: 11px 18px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(90deg, #f97316, #fb923c);
      color: #111827;
      font-size: 0.98rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(15,23,42,0.8);
    }

    .btn-primary:hover:enabled { filter: brightness(1.05); }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    .btn-secondary {
      flex: 1;
      padding: 11px 18px;
      border-radius: 999px;
      border: 1px solid #4b5563;
      background: transparent;
      color: #e5e7eb;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-secondary:hover { background: rgba(15,23,42,0.9); }

    /* Small reset pill: does not stretch */
    .btn-reset {
      flex: 0 0 auto;
      padding-inline: 14px;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    /* Mobile: stack buttons full-width */
    @media (max-width: 720px) {
      .button-row {
        flex-direction: column;
      }
      .button-row .btn-primary,
      .button-row .btn-secondary,
      .button-row .btn-reset {
        width: 100%;
        flex: none;
      }
    }

    /* RESULT PANEL (RIGHT) */

    .result-panel {
      background: radial-gradient(circle at top left, rgba(255,121,0,0.28), transparent 60%);
      border-radius: 20px;
      padding: 30px 24px 30px;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: opacity 0.2s ease-out, transform 0.2s ease-out;
    }

    .result-panel.calculating { opacity: 0.9; }

    .result-panel.calculating .roi-main-number,
    .result-panel.calculating .result-value {
      animation: pulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.4; }
      to   { opacity: 1; }
    }

    .result-header-eyebrow {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    .result-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .roi-main-value {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 6px;
    }

    .roi-main-number {
      font-size: 2.5rem;
      font-weight: 700;
      color: #f97316;
    }

    .roi-main-label {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .roi-tagline {
      font-size: 0.9rem;
      color: #e5e7eb;
      margin-top: 6px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 0.82rem;
      background: rgba(15,23,42,0.95);
      color: #e5e7eb;
      border: 1px solid rgba(148,163,184,0.5);
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .result-pill {
      background: rgba(15,23,42,0.95);
      border-radius: 12px;
      padding: 12px 13px;
      border: 1px solid rgba(55,65,81,0.9);
    }

    .result-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .result-value {
      font-size: 1.05rem;
      font-weight: 600;
      color: #f9fafb;
    }

    .result-summary {
      font-size: 0.9rem;
      color: #d1d5db;
      margin-top: 18px;
    }

    .disclaimer {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .result-actions {
      margin-top: 12px;
    }

    .result-actions .btn-secondary {
      display: inline-block;
      text-align: center;
      width: 100%;
      max-width: 260px;
      flex: none;
    }

    /* NEW: PDF Template Hiding and Styling */
    .pdf-template {
      position: absolute !important;
      left: -9999px !important;
      top: -9999px !important;
      z-index: -10 !important;
      width: 210mm; /* A4 width */
      padding: 20mm;
      background: white;
      color: #111827; /* Dark text for PDF */
      font-family: Arial, sans-serif;
      box-shadow: none;
      min-height: 297mm; /* Ensure it's large enough for A4 */
    }

    .pdf-template h1 {
        font-size: 26pt;
        color: #FF7900; /* Speexx accent color */
        border-bottom: 3px solid #f2f5f7;
        padding-bottom: 10px;
        margin: 0 0 20px 0;
    }
    .pdf-template h2 {
        font-size: 18pt;
        color: #020617;
        margin-top: 30px;
        margin-bottom: 15px;
    }
    .pdf-template h3 {
        font-size: 14pt;
        color: #111827;
        margin-top: 20px;
    }
    .pdf-template p {
        font-size: 11pt;
        line-height: 1.6;
        margin-bottom: 15px;
    }
    .pdf-template .summary-box {
        background: #f0f4f8;
        padding: 25px;
        margin-top: 20px;
        border-radius: 8px;
    }
    .pdf-template .summary-value {
        font-size: 44pt;
        font-weight: bold;
        color: #f97316;
        margin: 0;
        line-height: 1.1;
    }
    .pdf-template .summary-label {
        font-size: 14pt;
        color: #4b5563;
        margin-top: 5px;
    }
    .pdf-template table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
    }
    .pdf-template th, .pdf-template td {
        padding: 10px;
        border-bottom: 1px solid #ddd;
        text-align: left;
        font-size: 10pt;
    }
    .pdf-template th {
        background-color: #f9f9f9;
        font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="page">
      <header>
        <h1>Speexx Language Training ROI Calculator</h1>
        <p>Estimate the potential return of investing in language training for your organisation. Answer three short steps and explore different scenarios.</p>
      </header>

      <main class="main-card">
        <section class="form-panel" aria-label="ROI input steps">
          <div class="steps-header">
            <div class="steps-title">Describe Your Situation</div>
            <div class="steps-subtitle">We’ll guide you through 3 simple steps.</div>
          </div>

          <div class="progress-wrapper">
            <div class="progress-track">
              <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-label">
              <span id="progressText">Step 1 of 3</span>
              <span id="progressHint">Company Profile</span>
            </div>
          </div>

          <div class="calc-status hidden" id="calcStatus">
            Waiting for calculation…
          </div>

          <div class="step active" data-step="1">
            <div class="step-header">
              <div class="step-badge">1</div>
              <div>
                <div class="step-title">Company Profile</div>
                <div class="step-hint">We’ll use this to align with typical industry benchmarks.</div>
              </div>
            </div>

            <div class="field">
              <label for="region">Region</label>
              <select id="region">
                <option value="na">North America (NA)</option>
                <option value="emea" selected>Europe, Middle East and Africa (EMEA)</option>
                <option value="apac">Asia-Pacific (APAC)</option>
                <option value="latam">Latin America (LATAM)</option>
              </select>
            </div>

            <div class="field">
              <label for="companySize">Company Size</label>
              <select id="companySize">
                <option value="1-500" selected>1–500 Employees</option>
                <option value="501-1000">501–1,000 Employees</option>
                <option value="1001-5000">1,001–5,000 Employees</option>
                <option value="5001-10000">5,001–10,000 Employees</option>
                <option value="10001+">10,001+ Employees</option>
              </select>
            </div>

            <div class="field">
              <label for="industry">Industry</label>
              <select id="industry">
                <option value="automotive">Automotive</option>
                <option value="banking_finance">Banking and Finance</option>
                <option value="education">Education</option>
                <option value="energy">Energy</option>
                <option value="entertainment">Entertainment</option>
                <option value="healthcare_pharma">Healthcare and Pharma</option>
                <option value="hospitality">Hospitality</option>
                <option value="it">Information Technology</option>
                <option value="manufacturing_hitech">Manufacturing and Hitech</option>
                <option value="oil_gas">Oil and Gas</option>
                <option value="public_sector">Public Sector</option>
                <option value="retail">Retail</option>
                <option value="telecommunication">Telecommunication</option>
                <option value="transport_logistics">Transport and Logistics</option>
              </select>
            </div>

            <div class="button-row">
              <button class="btn-secondary btn-reset" type="button" onclick="resetForm()">
                Reset
              </button>
              <button class="btn-primary" type="button" onclick="nextStep()">
                Next: Training Scope
              </button>
            </div>
          </div>

          <div class="step" data-step="2">
            <div class="step-header">
              <div class="step-badge">2</div>
              <div>
                <div class="step-title">Training Scope</div>
                <div class="step-hint">Who will be involved and how intensive the training is.</div>
              </div>
            </div>

            <div class="field">
              <label for="learners">Number of Learners</label>
              <input type="number" id="learners" value="50" min="1" />
            </div>

            <div class="field">
              <label>Programme Intensity</label>
              <div class="radio-group">
                <label><input type="radio" name="intensity" value="light"> Light</label>
                <label><input type="radio" name="intensity" value="standard" checked> Standard</label>
                <label><input type="radio" name="intensity" value="intensive"> Intensive</label>
              </div>
              <small>We estimate typical benchmark costs per learner if you don’t provide your own.</small>
            </div>

            <div class="field">
              <label for="costPerLearner">Estimated Training Cost per Learner per Year</label>
              <input
                type="number"
                id="costPerLearner"
                min="0"
                placeholder="e.g. 1500"
              />
              <small>If you’re not sure, leave this field blank and we’ll use benchmark estimates based on your settings.</small>
            </div>

            <div class="field">
              <label>Languages in the Program</label>
              <div class="checkbox-group impact-grid" id="languageGroup">
                <label><input type="checkbox" value="english" checked> English</label>
                <label><input type="checkbox" value="spanish"> Spanish</label>
                <label><input type="checkbox" value="french"> French</label>
                <label><input type="checkbox" value="german"> German</label>
                <label><input type="checkbox" value="mandarin"> Mandarin Chinese</label>
                <label><input type="checkbox" value="portuguese"> Portuguese</label>
                <label><input type="checkbox" value="japanese"> Japanese</label>
                <label><input type="checkbox" value="arabic"> Arabic</label>
                <label><input type="checkbox" value="italian"> Italian</label>
                <label><input type="checkbox" value="dutch"> Dutch</label>
              </div>
              <small>You can select one or several languages based on your global footprint.</small>
            </div>

            <div class="button-row">
              <button class="btn-secondary" type="button" onclick="prevStep()">
                Back
              </button>
              <button class="btn-secondary btn-reset" type="button" onclick="resetForm()">
                Reset
              </button>
              <button class="btn-primary" type="button" onclick="nextStep()">
                Next: Expected Impact
              </button>
            </div>
          </div>

          <div class="step" data-step="3">
            <div class="step-header">
              <div class="step-badge">3</div>
              <div>
                <div class="step-title">Expected Impact</div>
                <div class="step-hint">Where do you most want to see change?</div>
              </div>
            </div>

            <div class="field">
              <label>Strategic Importance</label>
              <div class="radio-group">
                <label><input type="radio" name="importance" value="low"> Low</label>
                <label><input type="radio" name="importance" value="medium" checked> Medium</label>
                <label><input type="radio" name="importance" value="high"> High</label>
              </div>
            </div>

            <div class="field">
              <label>Main Impact Areas</label>
              <div class="checkbox-group impact-grid" id="impactGroup">
                <label>
                  <input type="checkbox" value="emp_communication" checked>
                  Improve learner communication skills
                </label>
                <label>
                  <input type="checkbox" value="emp_confidence">
                  Boost learner confidence &amp; engagement
                </label>
                <label>
                  <input type="checkbox" value="customer_comm">
                  Enhance customer communication
                </label>
                <label>
                  <input type="checkbox" value="intl_collaboration">
                  Support international collaboration
                </label>
                <label>
                  <input type="checkbox" value="productivity">
                  Increase overall productivity
                </label>
                <label>
                  <input type="checkbox" value="team_collaboration">
                  Improve team collaboration
                </label>
                <label>
                  <input type="checkbox" value="culture_inclusion">
                  Strengthen company culture &amp; inclusion
                </label>
                <label>
                  <input type="checkbox" value="fewer_miscommunications">
                  Reduce miscommunication issues
                </label>
                <label>
                  <input type="checkbox" value="onboarding">
                  Improve onboarding for multilingual employees
                </label>
                <label>
                  <input type="checkbox" value="global_expansion">
                  Support global expansion or cross-border work
                </label>
              </div>
            </div>

            <div class="field">
              <label>Time Horizon</label>
              <div class="radio-group">
                <label><input type="radio" name="horizon" value="6m"> 6 Months</label>
                <label><input type="radio" name="horizon" value="12m" checked> 12 Months</label>
                <label><input type="radio" name="horizon" value="24m"> 24 Months</label>
              </div>
            </div>

            <div class="button-row">
              <button class="btn-secondary" type="button" onclick="prevStep()">
                Back
              </button>
              <button class="btn-secondary btn-reset" type="button" onclick="resetForm()">
                Reset
              </button>
              <button class="btn-primary" type="button" id="calculateBtn" onclick="calculateROI()">
                Calculate ROI
              </button>
            </div>
          </div>
        </section>

        <section class="result-panel" id="resultPanel" aria-label="Estimated ROI">
          <div class="result-header-eyebrow">Your Scenario</div>
          <div class="result-title">Estimated Return on Investment</div>

          <div class="roi-main-value">
            <div class="roi-main-number" id="roiValue">—</div>
            <div class="roi-main-label">ROI</div>
          </div>
          <p class="roi-tagline" id="roiTagline" aria-live="polite">
            Start by filling in the steps on the left and calculating your scenario.
          </p>

          <span id="confidenceChip" class="badge" aria-live="polite">
            —
          </span>

          <div class="result-grid" aria-live="polite">
            <div class="result-pill">
              <div class="result-label">Estimated Annual Benefit</div>
              <div class="result-value" id="benefitValue">—</div>
            </div>
            <div class="result-pill">
              <div class="result-label">Per €1 Invested</div>
              <div class="result-value" id="perEuroValue">—</div>
            </div>
          </div>

          <p class="result-summary" id="summaryText" aria-live="polite">
            Complete all three steps and click “Calculate ROI” to see an estimate based on industry benchmarks.
          </p>

          <div class="result-actions">
            <button id="downloadButton" class="btn-secondary" onclick="downloadReport()" disabled>
              Download the Full Report
            </button>
          </div>

          <p class="disclaimer">
            This model provides directional guidance for HR and business leaders. For budgeting, use it alongside your own cost and performance data.
          </p>
        </section>
      </main>
    </div>
  </div>

  <div id="pdf-report-template" class="pdf-template">
    <h1>Speexx Language Training ROI Report</h1>
    <p>Report generated on: <span id="reportDate"></span></p>

    <div class="summary-box">
        <h2>Estimated Return on Investment (ROI)</h2>
        <p class="summary-value" id="pdfRoiValue"></p>
        <p class="summary-label">Estimated ROI over <span id="pdfTimeHorizon"></span></p>
    </div>

    <div class="section">
        <h2>Summary of Financial Outcomes</h2>
        <table>
            <thead>
                <tr><th>Metric</th><th>Value</th><th>Notes</th></tr>
            </thead>
            <tbody>
                <tr><td>Estimated Annual Benefit</td><td id="pdfBenefitValue"></td><td>Based on industry benchmarks and selected impact areas.</td></tr>
                <tr><td>Estimated Total Investment</td><td id="pdfTotalCost"></td><td>Cost of training for <span id="pdfLearnerCount"></span> learners.</td></tr>
                <tr><td>Return per €1 Invested</td><td id="pdfPerEuroValue"></td><td>The value returned for every Euro spent.</td></tr>
            </tbody>
        </table>
    </div>

    <div class="section">
        <h2>Your Scenario Settings</h2>
        <table>
            <thead>
                <tr><th colspan="2">Company Profile</th></tr>
            </thead>
            <tbody>
                <tr><td>Region</td><td id="pdfRegion"></td></tr>
                <tr><td>Company Size</td><td id="pdfCompanySize"></td></tr>
                <tr><td>Industry</td><td id="pdfIndustry"></td></tr>
            </tbody>
        </table>
        
        <table>
            <thead>
                <tr><th colspan="2">Training Scope</th></tr>
            </thead>
            <tbody>
                <tr><td>Number of Learners</td><td id="pdfLearners"></td></tr>
                <tr><td>Programme Intensity</td><td id="pdfIntensity"></td></tr>
                <tr><td>Cost per Learner (Estimated)</td><td id="pdfCostPerLearner"></td></tr>
                <tr><td>Languages in Program</td><td id="pdfLanguages"></td></tr>
            </tbody>
        </table>

        <table>
            <thead>
                <tr><th colspan="2">Expected Impact</th></tr>
            </thead>
            <tbody>
                <tr><td>Strategic Importance</td><td id="pdfImportance"></td></tr>
                <tr><td>Time Horizon</td><td id="pdfHorizon"></td></tr>
                <tr><td>Main Impact Areas</td><td id="pdfImpacts"></td></tr>
            </tbody>
        </table>
    </div>

    <div class="section">
        <h2>Methodology and Disclaimer</h2>
        <p>This report provides directional guidance for HR and business leaders to assess the potential value of language training. The results are calculated based on aggregation of global data and recognized industry benchmarks. Actual results for individual businesses may differ significantly based on market, customer base, execution quality, and other factors. **Speexx cannot guarantee the exact results shown in this calculation.**</p>
        
        <h3>Key Calculation Drivers:</h3>
        <ul>
            <li>**Total Cost:** Based on your number of learners and the estimated cost per learner (either manually entered or derived from intensity, region, industry, and company size benchmarks).</li>
            <li>**Effective Multiplier:** Calculated using factors like strategic importance, time horizon, industry bonus, and scope complexity (languages and impacts selected) to derive the total benefit.</li>
            <li>**ROI:** (Total Benefit - Total Cost) / Total Cost.</li>
        </ul>
        <p>Generated by the Speexx ROI Calculator on <span id="reportDateFooter"></span>.</p>
    </div>
  </div>


  <script>
    // ---- CONFIG CONSTANTS ----
    const INTENSITY_COST = { light: 500, standard: 1500, intensive: 3000 };

    // Size bands & scaling factors (economies of scale)
    const SIZE_FACTOR = {
      '1-500': 1.1,
      '501-1000': 1.0,
      '1001-5000': 0.9,
      '5001-10000': 0.85,
      '10001+': 0.8
    };

    const SIZE_HEADCOUNT = {
      '1-500': 250,
      '501-1000': 750,
      '1001-5000': 3000,
      '5001-10000': 7500,
      '10001+': 15000
    };

    // NEW: region-specific cost multipliers (relative to global baseline)
    const REGION_COST_MULT = {
      na: 1.1,   // typically higher budgets
      emea: 0.8, // lower average spend than NA
      apac: 0.7,
      latam: 0.6
    };

    // NEW: industry-specific cost multipliers (training budgets differ by sector)
    const INDUSTRY_COST_MULT = {
      automotive: 1.0,
      banking_finance: 1.2,
      education: 0.9,
      energy: 1.0,
      entertainment: 1.0,
      healthcare_pharma: 1.15,
      hospitality: 0.9,
      it: 1.15,
      manufacturing_hitech: 1.05,
      oil_gas: 1.05,
      public_sector: 0.8,
      retail: 0.85,
      telecommunication: 1.05,
      transport_logistics: 0.95
    };

    const INDUSTRY_BONUS = {
      automotive: 0.3,
      banking_finance: 0.5,
      education: 0.3,
      energy: 0.2,
      entertainment: 0.3,
      healthcare_pharma: 0.5,
      hospitality: 0.6,
      it: 0.5,
      manufacturing_hitech: 0.4,
      oil_gas: 0.3,
      public_sector: 0.2,
      retail: 0.4,
      telecommunication: 0.5,
      transport_logistics: 0.3
    };

    const IMPORTANCE_FACTOR = { low: 0.8, medium: 1.0, high: 1.2 };
    const TIME_FACTOR = { '6m': 0.6, '12m': 1.0, '24m': 1.3 };

    const LANGUAGE_WEIGHTS = {
      english: 1.0,
      mandarin: 0.9,
      spanish: 0.8,
      german: 0.7,
      french: 0.7,
      portuguese: 0.6,
      arabic: 0.6,
      japanese: 0.6,
      italian: 0.4,
      dutch: 0.4
    };

    // NEW: Mapping for display names
    const DISPLAY_MAP = {
      region: { na: 'North America', emea: 'EMEA', apac: 'Asia-Pacific', latam: 'Latin America' },
      companySize: { '1-500': '1–500 Employees', '501-1000': '501–1,000 Employees', '1001-5000': '1,001–5,000 Employees', '5001-10000': '5,001–10,000 Employees', '10001+': '10,001+ Employees' },
      industry: { automotive: 'Automotive', banking_finance: 'Banking and Finance', education: 'Education', energy: 'Energy', entertainment: 'Entertainment', healthcare_pharma: 'Healthcare and Pharma', hospitality: 'Hospitality', it: 'Information Technology', manufacturing_hitech: 'Manufacturing and Hitech', oil_gas: 'Oil and Gas', public_sector: 'Public Sector', retail: 'Retail', telecommunication: 'Telecommunication', transport_logistics: 'Transport and Logistics' },
      intensity: { light: 'Light', standard: 'Standard', intensive: 'Intensive' },
      importance: { low: 'Low', medium: 'Medium', high: 'High' },
      horizon: { '6m': '6 Months', '12m': '12 Months', '24m': '24 Months' },
      impacts: {
        emp_communication: 'Improve learner communication skills', emp_confidence: 'Boost learner confidence & engagement', customer_comm: 'Enhance customer communication', intl_collaboration: 'Support international collaboration', productivity: 'Increase overall productivity', team_collaboration: 'Improve team collaboration', culture_inclusion: 'Strengthen company culture & inclusion', fewer_miscommunications: 'Reduce miscommunication issues', onboarding: 'Improve onboarding for multilingual employees', global_expansion: 'Support global expansion or cross-border work'
      },
      languages: { english: 'English', spanish: 'Spanish', french: 'French', german: 'German', mandarin: 'Mandarin Chinese', portuguese: 'Portuguese', japanese: 'Japanese', arabic: 'Arabic', italian: 'Italian', dutch: 'Dutch' }
    };

    let currentStep = 1;
    const totalSteps = 3;
    let isCalculating = false;

    // NEW: Global object to hold calculation results for the report
    let lastCalculationData = null;

    const getSelectedRadio = (name) =>
      document.querySelector(`input[name="${name}"]:checked`)?.value;

    const fmtMoney = (val) =>
      '€' + (Math.round(val / 100) * 100).toLocaleString('en-US');

    function resetResultsCard() {
      const roiValue = document.getElementById('roiValue');
      const benefitValue = document.getElementById('benefitValue');
      const perEuroValue = document.getElementById('perEuroValue');
      const roiTagline = document.getElementById('roiTagline');
      const summaryText = document.getElementById('summaryText');
      const confidenceChip = document.getElementById('confidenceChip');
      const resultPanel = document.getElementById('resultPanel');
      const calcBtn = document.getElementById('calculateBtn');
      const calcStatus = document.getElementById('calcStatus');
      const downloadBtn = document.getElementById('downloadButton'); // NEW

      roiValue.textContent = '—';
      benefitValue.textContent = '—';
      perEuroValue.textContent = '—';
      roiTagline.textContent = 'Start by filling in the steps on the left and calculating your scenario.';
      summaryText.textContent = 'Complete all three steps and click “Calculate ROI” to see an estimate based on industry benchmarks.';
      confidenceChip.textContent = '—';
      resultPanel.classList.remove('calculating');
      if (calcBtn) calcBtn.disabled = false;
      if (calcStatus) calcStatus.classList.add('hidden');
      if (downloadBtn) downloadBtn.disabled = true; // NEW
      isCalculating = false;
      lastCalculationData = null; // NEW
    }

    function showStep(step) {
      currentStep = step;

      document.querySelectorAll('.step').forEach((s) => {
        const stepNum = parseInt(s.getAttribute('data-step'), 10);
        s.classList.toggle('active', stepNum === currentStep);
      });

      const progressBar = document.getElementById('progressBar');
      const progressText = document.getElementById('progressText');
      const progressHint = document.getElementById('progressHint');

      const percent = (currentStep / totalSteps) * 100;
      progressBar.style.width = percent + '%';
      progressText.textContent = `Step ${currentStep} of ${totalSteps}`;

      const hintMap = {
        1: 'Company Profile',
        2: 'Training Scope',
        3: 'Expected Impact'
      };
      progressHint.textContent = hintMap[currentStep] || '';
    }

    function nextStep() {
      if (currentStep < totalSteps) showStep(currentStep + 1);
    }

    function prevStep() {
      if (currentStep > 1) showStep(currentStep - 1);
    }

    function resetForm() {
      // Reset dropdowns
      document.querySelectorAll('select').forEach(sel => {
        // Reset to first option, or the one marked 'selected' in HTML
        sel.selectedIndex = 0; 
      });

      // Step 2 defaults
      document.getElementById('learners').value = 50;
      document.querySelectorAll('input[name="intensity"]').forEach(r => {
        r.checked = (r.value === 'standard');
      });
      document.getElementById('costPerLearner').value = '';
      document.querySelectorAll('#languageGroup input[type="checkbox"]').forEach(cb => {
        cb.checked = (cb.value === 'english');
      });

      // Step 3 defaults
      document.querySelectorAll('input[name="importance"]').forEach(r => {
        r.checked = (r.value === 'medium');
      });
      document.querySelectorAll('input[name="horizon"]').forEach(r => {
        r.checked = (r.value === '12m');
      });
      document.querySelectorAll('#impactGroup input[type="checkbox"]').forEach(cb => {
        cb.checked = (cb.value === 'emp_communication');
      });

      resetResultsCard();
      showStep(1);
    }

    function calculateROI() {
      if (isCalculating) return;

      const region = document.getElementById('region').value;
      const companySize = document.getElementById('companySize').value;
      const industry = document.getElementById('industry').value;
      const learners = parseInt(document.getElementById('learners').value || '0', 10);

      const intensity = getSelectedRadio('intensity');
      const importance = getSelectedRadio('importance');
      const horizon = getSelectedRadio('horizon');

      const impactCheckboxes = document.querySelectorAll('#impactGroup input[type="checkbox"]:checked');
      const impacts = Array.from(impactCheckboxes).map(cb => cb.value);

      const languageCheckboxes = document.querySelectorAll('#languageGroup input[type="checkbox"]:checked');
      const languages = Array.from(languageCheckboxes).map(cb => cb.value);

      const roiValue = document.getElementById('roiValue');
      const benefitValue = document.getElementById('benefitValue');
      const perEuroValue = document.getElementById('perEuroValue');
      const roiTagline = document.getElementById('roiTagline');
      const summaryText = document.getElementById('summaryText');
      const confidenceChip = document.getElementById('confidenceChip');
      const resultPanel = document.getElementById('resultPanel');
      const calcBtn = document.getElementById('calculateBtn');
      const calcStatus = document.getElementById('calcStatus');
      const downloadBtn = document.getElementById('downloadButton'); // NEW

      const isComplete =
        learners > 0 &&
        impacts.length > 0 &&
        languages.length > 0;

      if (!isComplete) {
        roiValue.textContent = '—';
        benefitValue.textContent = '—';
        perEuroValue.textContent = '—';
        roiTagline.textContent = 'Please complete all steps (at least one learner, one language, and one impact area) before calculating.';
        summaryText.textContent = 'Make sure you have added at least one learner, selected at least one language, and chosen where you expect impact.';
        confidenceChip.textContent = '—';
        resultPanel.classList.remove('calculating');
        if (calcBtn) calcBtn.disabled = false;
        if (calcStatus) calcStatus.classList.add('hidden');
        if (downloadBtn) downloadBtn.disabled = true; // NEW
        isCalculating = false;
        return;
      }

      // Start animation + waiting label
      isCalculating = true;
      resultPanel.classList.add('calculating');
      calcBtn.disabled = true;
      if (calcStatus) calcStatus.classList.remove('hidden');
      if (downloadBtn) downloadBtn.disabled = true; // NEW

      roiValue.textContent = '…';
      benefitValue.textContent = '…';
      perEuroValue.textContent = '…';
      roiTagline.textContent = 'Calculating your scenario…';
      summaryText.textContent = 'We are applying your inputs to typical industry benchmarks. This only takes a moment.';

      setTimeout(() => {
        // ----- COST -----
        const sizeFactor = SIZE_FACTOR[companySize] ?? 1.0;
        const intensityCost = INTENSITY_COST[intensity] ?? 1500;
        const regionCostMult = REGION_COST_MULT[region] ?? 1.0;
        const industryCostMult = INDUSTRY_COST_MULT[industry] ?? 1.0;

        const manualCostInput = parseFloat(document.getElementById('costPerLearner').value || '0');

        // Benchmark cost per learner combining intensity, region, industry, and size
        const benchmarkCostPerLearner =
          intensityCost * regionCostMult * industryCostMult * sizeFactor;

        // Actual cost per learner (manual if provided, otherwise benchmark)
        const costPerLearner = (manualCostInput > 0)
          ? manualCostInput
          : benchmarkCostPerLearner;

        const totalCost = learners * costPerLearner;

        // ----- READINESS -----
        const estHeadcount = SIZE_HEADCOUNT[companySize] ?? 750;
        const participationRate = estHeadcount > 0 ? (learners / estHeadcount) : 0;

        let readinessFactor;
        if (participationRate < 0.05)      readinessFactor = 0.8;
        else if (participationRate < 0.15) readinessFactor = 1.0;
        else if (participationRate < 0.4)  readinessFactor = 1.1;
        else                               readinessFactor = 1.15;

        // ----- MULTIPLIERS & BONUSES -----
        const industryBonus = INDUSTRY_BONUS[industry] ?? 0.3;
        const importanceFactor = IMPORTANCE_FACTOR[importance] ?? 1.0;
        const timeFactor = TIME_FACTOR[horizon] ?? 1.0;

        const impactBonus = Math.min(0.1 * impacts.length, 0.5);

        let languageScore = 0;
        languages.forEach(lang => {
          languageScore += (LANGUAGE_WEIGHTS[lang] ?? 0.4);
        });
        let normalizedLanguage = Math.sqrt(languageScore || 0.4);
        normalizedLanguage = Math.max(normalizedLanguage, 0.8);
        normalizedLanguage = Math.min(normalizedLanguage, 2.0);
        const languageBonus = (normalizedLanguage - 1) * 0.2;

        // Cost efficiency: how far from benchmark cost?
        let costEfficiency = benchmarkCostPerLearner / costPerLearner;
        if (!isFinite(costEfficiency) || costEfficiency <= 0) costEfficiency = 1;
        costEfficiency = Math.max(0.7, Math.min(costEfficiency, 1.3));

        const baseMultiplier = 2.0;
        let effectiveMultiplier =
          baseMultiplier * importanceFactor * timeFactor * readinessFactor
          * costEfficiency
          + industryBonus + impactBonus + languageBonus;

        effectiveMultiplier = Math.min(effectiveMultiplier, 6.0);

        const totalBenefit = totalCost * effectiveMultiplier;
        const roiPct = totalCost > 0 ? ((totalBenefit - totalCost) / totalCost) * 100 : 0;
        const returnPerEuro = totalCost > 0 ? totalBenefit / totalCost : 0;

        // Confidence
        let confidence = 'Low';
        if (learners > 0 && impacts.length >= 2) confidence = 'Medium';
        if (learners > 0 && impacts.length >= 3 && horizon !== '6m') confidence = 'High';

        // Tagline
        let roiTaglineText;
        if (totalCost === 0) {
          roiTaglineText = 'Enter at least one learner to see your scenario.';
        } else if (roiPct < 50) {
          roiTaglineText = 'Conservative scenario – useful as a low-end estimate or pilot phase.';
        } else if (roiPct < 150) {
          roiTaglineText = 'Solid business case – language training is likely to pay off clearly.';
        } else {
          roiTaglineText = 'High-impact scenario – strong potential upside if the program is well executed.';
        }
        
        // NEW: Store all results for the report
        lastCalculationData = {
          region: region,
          companySize: companySize,
          industry: industry,
          learners: learners,
          intensity: intensity,
          costPerLearner: costPerLearner,
          manualCostInput: manualCostInput,
          totalCost: totalCost,
          languages: languages,
          importance: importance,
          impacts: impacts,
          horizon: horizon,
          totalBenefit: totalBenefit,
          roiPct: roiPct,
          returnPerEuro: returnPerEuro,
          confidence: confidence,
          roiTaglineText: roiTaglineText
        };

        // Update UI
        roiValue.textContent = isFinite(roiPct) ? Math.round(roiPct) + '%' : '—';
        benefitValue.textContent = isFinite(totalBenefit) ? fmtMoney(totalBenefit) : '—';
        perEuroValue.textContent = isFinite(returnPerEuro) ? '€' + returnPerEuro.toFixed(2) : '—';
        roiTagline.textContent = roiTaglineText;

        summaryText.textContent =
          totalCost > 0
            ? `For every €1 invested in language training, this scenario suggests a return of approximately €${returnPerEuro.toFixed(2)} over the selected time horizon.`
            : 'Please enter at least one learner to see an estimate.';

        confidenceChip.textContent = confidence + ' confidence';

        resultPanel.classList.remove('calculating');
        calcBtn.disabled = false;
        if (calcStatus) calcStatus.classList.add('hidden');
        if (downloadBtn) downloadBtn.disabled = false; // NEW: Enable Download Button
        isCalculating = false;
      }, 2000);
    }

    // NEW FUNCTION: Populates the hidden HTML template with the calculated data
    function populateReportTemplate(data) {
        const d = new Date().toLocaleDateString();
        document.getElementById('reportDate').textContent = d;
        document.getElementById('reportDateFooter').textContent = d;

        // Summary
        document.getElementById('pdfRoiValue').textContent = Math.round(data.roiPct) + '%';
        document.getElementById('pdfTimeHorizon').textContent = DISPLAY_MAP.horizon[data.horizon];

        document.getElementById('pdfBenefitValue').textContent = fmtMoney(data.totalBenefit);
        document.getElementById('pdfTotalCost').textContent = fmtMoney(data.totalCost);
        document.getElementById('pdfPerEuroValue').textContent = '€' + data.returnPerEuro.toFixed(2);
        document.getElementById('pdfLearnerCount').textContent = data.learners.toLocaleString('en-US');

        // Inputs
        document.getElementById('pdfRegion').textContent = DISPLAY_MAP.region[data.region];
        document.getElementById('pdfCompanySize').textContent = DISPLAY_MAP.companySize[data.companySize];
        document.getElementById('pdfIndustry').textContent = DISPLAY_MAP.industry[data.industry];
        
        document.getElementById('pdfLearners').textContent = data.learners.toLocaleString('en-US');
        document.getElementById('pdfIntensity').textContent = DISPLAY_MAP.intensity[data.intensity];
        
        const costSource = data.manualCostInput > 0 ? `€${data.costPerLearner.toFixed(2)} (User Input)` : `€${data.costPerLearner.toFixed(2)} (Benchmark)`;
        document.getElementById('pdfCostPerLearner').textContent = costSource;
        
        const languageNames = data.languages.map(key => DISPLAY_MAP.languages[key]).join(', ');
        document.getElementById('pdfLanguages').textContent = languageNames || 'None Selected';

        document.getElementById('pdfImportance').textContent = DISPLAY_MAP.importance[data.importance];
        document.getElementById('pdfHorizon').textContent = DISPLAY_MAP.horizon[data.horizon];
        
        const impactNames = data.impacts.map(key => DISPLAY_MAP.impacts[key]).join('; ');
        document.getElementById('pdfImpacts').textContent = impactNames || 'None Selected';
    }

    // NEW FUNCTION: Generates and downloads the PDF using html2canvas and jsPDF
    function downloadReport() {
        if (!lastCalculationData) {
            alert('Please run the calculation first.');
            return;
        }

        const downloadButton = document.getElementById('downloadButton');
        downloadButton.disabled = true;
        downloadButton.textContent = 'Generating PDF...';

        // 1. Populate the hidden template with final data
        populateReportTemplate(lastCalculationData);
        const input = document.getElementById('pdf-report-template');

        // 2. Use html2canvas to convert the hidden element to a canvas (image)
        html2canvas(input, {
            scale: 3, // Higher scale for better resolution
            logging: false,
            useCORS: true,
            width: input.offsetWidth,
            height: input.offsetHeight,
        }).then(canvas => {
            const { jsPDF } = window.jspdf;
            
            // A4 dimensions in pt (standard unit for jsPDF)
            const pdfWidth = 595.28;
            const pdfHeight = 841.89; 

            const imgData = canvas.toDataURL('image/jpeg', 1.0); // Convert canvas to JPEG data URL
            const imgWidth = pdfWidth; 
            const imgHeight = (canvas.height * imgWidth) / canvas.width; // Maintain aspect ratio

            // Create PDF object
            const pdf = new jsPDF('p', 'pt', 'a4');
            
            let heightLeft = imgHeight;
            let position = 0;

            // 3. Add the image, handling multiple pages if necessary
            pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
            heightLeft -= pdfHeight;

            while (heightLeft >= 0) {
                position = heightLeft - imgHeight;
                pdf.addPage();
                pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
                heightLeft -= pdfHeight;
            }

            // 4. Download the PDF
            pdf.save('Speexx_ROI_Report.pdf');

            // 5. Reset button state
            downloadButton.disabled = false;
            downloadButton.textContent = 'Download the Full Report';
        }).catch(error => {
            console.error('PDF Generation failed:', error);
            alert('Failed to generate report. Check console for details.');
            downloadButton.disabled = false;
            downloadButton.textContent = 'Download the Full Report';
        });
    }


    document.addEventListener('DOMContentLoaded', () => {
      showStep(1);
    });
  </script>
</body>
</html>
